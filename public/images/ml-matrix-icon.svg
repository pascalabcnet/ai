<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120"
     role="img" aria-labelledby="title desc">
  <title id="title">ML matrix icon</title>
  <desc id="desc">3 by 3 rounded matrix icon with a thin outlined bottom-right cell and a centered dot</desc>

  <defs>
    <linearGradient id="darkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5166FF"/>
      <stop offset="100%" stop-color="#2F45E8"/>
    </linearGradient>

    <linearGradient id="lightBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79A7FF"/>
      <stop offset="100%" stop-color="#5A8FF2"/>
    </linearGradient>
  </defs>

  <!-- Row 1 -->
  <rect x="14" y="14" width="27" height="27" rx="5" fill="url(#darkBlue)"/>
  <rect x="47" y="14" width="27" height="27" rx="5" fill="url(#lightBlue)"/>
  <rect x="80" y="14" width="27" height="27" rx="5" fill="url(#darkBlue)"/>

  <!-- Row 2 -->
  <rect x="14" y="47" width="27" height="27" rx="5" fill="url(#darkBlue)"/>
  <rect x="47" y="47" width="27" height="27" rx="5" fill="url(#lightBlue)"/>
  <rect x="80" y="47" width="27" height="27" rx="5" fill="url(#lightBlue)"/>

  <!-- Row 3 -->
  <rect x="14" y="80" width="27" height="27" rx="5" fill="url(#darkBlue)"/>
  <rect x="47" y="80" width="27" height="27" rx="5" fill="url(#lightBlue)"/>

  <!-- Bottom-right outlined cell -->
  <rect x="80" y="80" width="27" height="27" rx="5"
        fill="none" stroke="#4257F4" stroke-width="2.5"/>
  <circle cx="93.5" cy="93.5" r="4" fill="#4257F4"/>
</svg>
